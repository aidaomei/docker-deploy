# /opt/app/nginx/conf/app.conf（Nginx核心配置，毕设专用）
server {
    # 监听端口：与config.env中NGINX_PORT=80:80一致，答辩直接用IP访问（无需输端口）
    listen 80;
    # 服务域名：答辩时可改为你的宿主机IP（如192.168.1.100），本地测试用localhost
    server_name localhost;

    # 字符编码：避免中文乱码（适配毕设前端中文显示）
    charset utf-8;

    # ==================== 1. 前端静态资源配置（毕设前端部署）====================
    # 宿主机前端文件路径：/opt/app/nginx/html（docker-compose挂载目录）
    # 容器内路径：/usr/share/nginx/html（Nginx默认静态资源目录）
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 适配Vue/React单页应用（刷新页面不404，毕设必配）
        # 缓存控制：静态资源缓存1天，避免频繁请求（优化性能）
        expires 1d;
    }

    # ==================== 2. 反向代理后端接口（核心，避免跨域）====================
    # 前端请求前缀：/api（如前端调用 /api/user/login → 代理到后端）
    # 后端服务地址：http://backend:8080（docker-compose中后端服务名，自动解析，无需改）
    location /api {
        # 代理指向后端服务（必须保留backend:8080，不能写IP）
        proxy_pass http://backend:8080;
        # 传递真实请求头，后端能获取客户端IP、域名等信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 超时配置：适配数据库查询、Redis缓存（避免接口超时）
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ==================== 3. 后端健康检查接口（适配docker-compose健康检查）====================
    location /actuator {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # 允许外部访问健康状态（答辩时可演示服务状态）
        allow all;
    }

    # ==================== 4. 静态资源优化（可选，毕设加分项）====================
    # 对JS、CSS、图片等静态资源单独配置缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 7d;  # 缓存7天，优化访问速度
        add_header Cache-Control "public, max-age=604800";
    }

    # ==================== 5. 错误页面配置（毕设体验优化）====================
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
